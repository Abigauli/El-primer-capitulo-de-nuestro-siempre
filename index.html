<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>El primer capítulo de nuestro siempre ❤️</title>

<style>
* {
    box-sizing: border-box;
}

html {
    scroll-behavior: smooth;
}

body {
    margin: 0;
    min-height: 100vh;
    font-family: Georgia, "Times New Roman", serif;
    color: #5b3b50;
    background: linear-gradient(135deg, #fff0f6, #f5e9ff);
    overflow-x: hidden;
}

body::before {
    content: "♡ ✦ ♡ ✧ ♡ ✦ ♡";
    position: fixed;
    top: 18px;
    left: 0;
    width: 100%;
    text-align: center;
    font-size: 20px;
    color: rgba(170,105,145,.25);
    letter-spacing: 12px;
    pointer-events: none;
    z-index: 0;
}

.screen {
    min-height: 100vh;
    display: none;
    justify-content: center;
    align-items: center;
    padding: 40px 16px;
    position: relative;
    z-index: 1;
}

.screen.active {
    display: flex;
}

.card {
    width: min(900px, 96%);
    background: rgba(255,255,255,.93);
    border-radius: 30px;
    padding: 38px 28px;
    box-shadow: 0 20px 60px rgba(100,60,90,.16);
    text-align: center;
    animation: aparecer .7s ease;
}

@keyframes aparecer {
    from {
        opacity: 0;
        transform: translateY(20px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

h1 {
    font-size: clamp(34px, 7vw, 62px);
    color: #8c4d73;
    margin: 15px 0 20px;
}

h2 {
    font-size: clamp(28px, 5vw, 40px);
    color: #9a547c;
    margin: 15px 0 25px;
}

p {
    font-size: 18px;
    line-height: 1.8;
}

.subtitle {
    font-size: 20px;
    font-style: italic;
    color: #89657b;
}

.heart {
    font-size: 64px;
    animation: latido 1.5s infinite;
}

@keyframes latido {
    0%,100% { transform: scale(1); }
    50% { transform: scale(1.12); }
}

button {
    border: none;
    border-radius: 30px;
    padding: 14px 23px;
    margin: 8px;
    font-size: 16px;
    cursor: pointer;
    background: #b96d99;
    color: white;
    box-shadow: 0 8px 20px rgba(120,70,100,.2);
    transition: .25s;
}

button:hover {
    transform: translateY(-3px);
}

.secondary {
    background: #ead6e5;
    color: #704b62;
}

.letters {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px,1fr));
    gap: 15px;
    margin-top: 30px;
}

.letter-button {
    min-height: 115px;
    background: linear-gradient(135deg,#fff7fb,#f5e8f2);
    color: #754c66;
    border: 1px solid #ead0df;
}

.letter-button span {
    display: block;
    font-size: 30px;
    margin-bottom: 8px;
}

.letter-content {
    text-align: left;
    max-height: 68vh;
    overflow-y: auto;
    padding: 8px;
}

.letter-content p {
    white-space: pre-line;
}

.center {
    text-align: center;
}

.placeholder {
    margin: 25px auto;
    padding: 30px;
    border: 2px dashed #d8adc6;
    border-radius: 22px;
    background: #fff8fc;
    color: #987087;
}

.photo-box {
    margin: 20px auto;
    padding: 25px;
    border-radius: 22px;
    background: rgba(255,255,255,.7);
    border: 1px dashed #d6a8c0;
    text-align: center;
}

.photo-box img {
    max-width: 100%;
    border-radius: 18px;
}

.music {
    margin: 20px 0;
    padding: 20px;
    border-radius: 20px;
    background: rgba(255,255,255,.7);
}

.music a {
    display: inline-block;
    margin: 7px;
    padding: 10px 15px;
    border-radius: 20px;
    background: #b96d99;
    color: white;
    text-decoration: none;
}

.reason {
    margin: 12px 0;
    padding: 17px;
    border-radius: 18px;
    background: rgba(255,255,255,.65);
    cursor: pointer;
}

.reason-answer {
    display: none;
    margin-top: 10px;
    padding: 12px;
    line-height: 1.7;
}

.reason.open .reason-answer {
    display: block;
}

.gallery {
    display: grid;
    grid-template-columns: repeat(auto-fit,minmax(180px,1fr));
    gap: 15px;
}

.gallery .photo-box {
    min-height: 180px;
}

.game {
    background: linear-gradient(135deg,#dff4ff,#ffe3e3);
    border-radius: 28px;
    padding: 25px;
    margin-top: 25px;
}

.tower {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 20px;
    margin: 20px 0;
}

.tower div {
    padding: 25px;
    border-radius: 20px;
    background: rgba(255,255,255,.7);
}

.battle-button {
    background: #7b4f9d;
}

footer {
    margin-top: 25px;
    font-size: 13px;
    color: #9b788d;
}

@media(max-width:600px) {
    .card {
        padding: 28px 18px;
    }

    p {
        font-size: 17px;
    }

    .tower {
        grid-template-columns: 1fr;
    }
}
</style>
</head>

function mostrar(id) {

    document.querySelectorAll(".screen").forEach(function(screen) {
        screen.classList.remove("active");
    });

    document.getElementById(id).classList.add("active");

    window.scrollTo({
        top: 0,
        behavior: "smooth"
    });
}


function abrirCarta(numero) {

    document.getElementById("contenidoCarta").innerHTML = cartas[numero];

    mostrar("carta");
}


function jugarBatalla() {

    const resultado = document.getElementById("resultadoBatalla");

    resultado.innerHTML = `
    ⚔️ ¡ATAQUE ACTIVADO! ⚔️
    <br><br>
    Abigail lanza su Mini P.E.K.K.A. 💗
    <br>
    Uriel responde con la Valquiria ⚔️
    <br><br>
    💥 ¡BOOM!

    La distancia perdió una torre.
    <br><br>
    ❤️ Pero el verdadero ganador...
    <br>
    <strong>somos nosotros.</strong>
    `;
}


function Razon(elemento) {
