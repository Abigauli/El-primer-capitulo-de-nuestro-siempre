<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Prueba ❤️</title>

<style>
body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: Georgia, serif;
    background: #ffeaf3;
    text-align: center;
}

.screen {
    display: none;
    padding: 30px;
}

.screen.active {
    display: block;
}

.card {
    background: white;
    padding: 40px;
    border-radius: 30px;
    box-shadow: 0 15px 40px rgba(0,0,0,.15);
}

button {
    padding: 15px 25px;
    border: none;
    border-radius: 25px;
    background: #b96d99;
    color: white;
    font-size: 16px;
}
</style>
</head>

<body>

<section id="inicio" class="screen active">
    <div class="card">
        <h1>El primer capítulo de nuestro siempre ❤️</h1>

        <button onclick="mostrar('cartas')">
            Abrir nuestros recuerdos ♡
        </button>
    </div>
</section>

<section id="cartas" class="screen">
    <div class="card">
        <h1>💌 Nuestros recuerdos</h1>

        <p>¡Funcionó! Ya estamos dentro de nuestras cartas. ❤️</p>

        <button onclick="mostrar('inicio')">
            ← Volver
        </button>
    </div>
</section>

<script>
function mostrar(id) {
    document.querySelectorAll('.screen').forEach(function(screen) {
        screen.classList.remove('active');
    });

    document.getElementById(id).classList.add('active');
}
</script>

</body>
</html>
