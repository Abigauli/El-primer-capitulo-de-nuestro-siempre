<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>El primer capítulo de nuestro siempre 💗</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: Georgia, "Times New Roman", serif;
      min-height: 100vh;
      overflow-x: hidden;
      background: linear-gradient(
        135deg,
        #fff0f6,
        #f7e8ff,
        #eee8ff,
        #ffeaf3
      );
      color: #5b4054;
    }

    /* Fondo de la portada */
    .portada {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 30px 20px;
      position: relative;
      overflow: hidden;
    }

    /* Capa suave de luz */
    .brillo {
      position: absolute;
      width: 500px;
      height: 500px;
      background: rgba(255, 255, 255, 0.45);
      border-radius: 50%;
      filter: blur(80px);
      animation: respirar 6s ease-in-out infinite;
    }

    @keyframes respirar {
      0%, 100% {
        transform: scale(0.9);
        opacity: 0.5;
      }

      50% {
        transform: scale(1.1);
        opacity: 0.8;
      }
    }

    /* Contenido */
    .contenido {
      position: relative;
      z-index: 5;
      max-width: 750px;
      animation: aparecer 2s ease;
    }

    @keyframes aparecer {
      from {
        opacity: 0;
        transform: translateY(30px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .pequeno {
      font-size: 17px;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: #a36b91;
      margin-bottom: 20px;
    }

    h1 {
      font-size: clamp(42px, 9vw, 78px);
      line-height: 1.05;
      color: #8e5278;
      margin-bottom: 25px;
      font-weight: normal;
      text-shadow: 0 5px 20px rgba(142, 82, 120, 0.15);
    }

    .corazon {
      font-size: 45px;
      display: block;
      margin: 10px 0 20px;
      animation: latido 1.8s ease-in-out infinite;
    }

    @keyframes latido {
      0%, 100% {
        transform: scale(1);
      }

      50% {
        transform: scale(1.18);
      }
    }

    .frase {
      font-size: 21px;
      line-height: 1.7;
      max-width: 620px;
      margin: 0 auto 35px;
      color: #684e61;
    }

    .dedicatoria {
      font-family: Arial, sans-serif;
      font-size: 14px;
      letter-spacing: 1px;
      color: #a36b91;
      margin-bottom: 35px;
    }

    /* Espacio para foto */
    .foto {
      width: 230px;
      height: 230px;
      margin: 0 auto 35px;
      border-radius: 50%;
      border: 7px solid rgba(255,255,255,0.8);
      box-shadow:
        0 10px 35px rgba(126, 78, 108, 0.18),
        0 0 0 8px rgba(255,255,255,0.25);

      display: flex;
      align-items: center;
      justify-content: center;

      background: linear-gradient(
        135deg,
        #f8d8e9,
        #e6d6f5
      );

      overflow: hidden;
    }

    .foto span {
      font-size: 60px;
    }

    /* Botón */
    .boton {
      display: inline-block;
      padding: 16px 32px;
      border-radius: 50px;
      background: linear-gradient(
        135deg,
        #c47ba7,
        #9b6bb0
      );
      color: white;
      text-decoration: none;
      font-family: Arial, sans-serif;
      font-size: 15px;
      letter-spacing: 1px;
      box-shadow: 0 10px 25px rgba(130, 82, 125, 0.25);
      transition: all 0.3s ease;
    }

    .boton:hover {
      transform: translateY(-4px) scale(1.03);
      box-shadow: 0 15px 30px rgba(130, 82, 125, 0.35);
    }

    /* Corazones flotando */
    .corazones {
      position: absolute;
      inset: 0;
      overflow: hidden;
      pointer-events: none;
    }

    .corazones span {
      position: absolute;
      bottom: -50px;
      font-size: 20px;
      opacity: 0.45;
      animation: subir linear infinite;
    }

    .corazones span:nth-child(1) {
      left: 8%;
      animation-duration: 9s;
      animation-delay: 1s;
    }

    .corazones span:nth-child(2) {
      left: 20%;
      animation-duration: 12s;
      animation-delay: 3s;
    }

    .corazones span:nth-child(3) {
      left: 35%;
      animation-duration: 10s;
      animation-delay: 0s;
    }

    .corazones span:nth-child(4) {
      left: 52%;
      animation-duration: 14s;
      animation-delay: 2s;
    }

    .corazones span:nth-child(5) {
      left: 68%;
      animation-duration: 11s;
      animation-delay: 4s;
    }

    .corazones span:nth-child(6) {
      left: 82%;
      animation-duration: 13s;
      animation-delay: 1s;
    }

    .corazones span:nth-child(7) {
      left: 92%;
      animation-duration: 9s;
      animation-delay: 5s;
    }

    @keyframes subir {
      0% {
        transform: translateY(0) rotate(0deg);
        opacity: 0;
      }

      15% {
        opacity: 0.5;
      }

      85% {
        opacity: 0.4;
      }

      100% {
        transform: translateY(-110vh) rotate(25deg);
        opacity: 0;
      }
    }

    /* Estrellas */
    .estrellita {
      position: absolute;
      color: white;
      font-size: 15px;
      animation: brilloEstrella 2s ease-in-out infinite alternate;
    }

    .e1 {
      top: 15%;
      left: 12%;
    }

    .e2 {
      top: 25%;
      right: 14%;
      animation-delay: 1s;
    }

    .e3 {
      bottom: 20%;
      left: 18%;
      animation-delay: 0.5s;
    }

    .e4 {
      bottom: 15%;
      right: 20%;
      animation-delay: 1.5s;
    }

    @keyframes brilloEstrella {
      from {
        opacity: 0.2;
        transform: scale(0.8);
      }

      to {
        opacity: 1;
        transform: scale(1.3);
      }
    }

    /* Adaptación para celular */
    @media (max-width: 600px) {

      .portada {
        padding: 25px 18px;
      }

      .pequeno {
        font-size: 13px;
        letter-spacing: 2px;
      }

      h1 {
        font-size: 45px;
      }

      .frase {
        font-size: 18px;
        line-height: 1.6;
      }

      .foto {
        width: 190px;
        height: 190px;
      }

      .foto span {
        font-size: 50px;
      }

      .boton {
        padding: 15px 25px;
      }
    }
  </style>
</head>

<body>

  <section class="portada">

    <div class="brillo"></div>

    <!-- Corazones flotantes -->
    <div class="corazones">
      <span>♡</span>
      <span>♥️</span>
      <span>♡</span>
      <span>♥️</span>
      <span>♡</span>
      <span>♥️</span>
      <span>♡</span>
    </div>

    <!-- Estrellitas -->
    <div class="estrellita e1">✦</div>
    <div class="estrellita e2">✧</div>
    <div class="estrellita e3">✦</div>
    <div class="estrellita e4">✧</div>

    <div class="contenido">

      <div class="pequeno">
        19 de agosto · 2026
      </div>

      <span class="corazon">♡</span>

      <h1>
        El primer capítulo<br>
        de nuestro siempre
      </h1>

      <p class="frase">
        Un año puede parecer poco tiempo para el mundo,
        pero contigo ha sido suficiente para crear recuerdos
        que quiero guardar para toda la vida.
      </p>

      <div class="foto">
        <span>📷</span>
      </div>

      <p class="dedicatoria">
        Para Uriel, con todo mi amor.
      </p>

      <a href="#recuerdos" class="boton">
        Abrir nuestro recuerdo 💌
      </a>

    </div>

  </section>

  <!-- Próximamente agregaremos aquí nuestras 12 cartas -->
  <section id="recuerdos"></section>

</body>
</html>
