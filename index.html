<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>El primer capítulo de nuestro siempre ❤️</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    font-family: Georgia, "Times New Roman", serif;
    background: linear-gradient(135deg, #fff0f6, #f5e9ff);
    color: #5b3b50;
    overflow-x: hidden;
}

body::before {
    content: "♡  ✦  ♡  ✧  ♡  ✦  ♡";
    position: fixed;
    top: 20px;
    left: 0;
    width: 100%;
    text-align: center;
    font-size: 22px;
    color: rgba(170, 105, 145, 0.25);
    letter-spacing: 18px;
    pointer-events: none;
}

.screen {
    min-height: 100vh;
    display: none;
    justify-content: center;
    align-items: center;
    padding: 30px 18px;
}

.screen.active {
    display: flex;
}

.card {
    width: min(850px, 95%);
    background: rgba(255,255,255,0.88);
    border: 1px solid rgba(160,100,140,0.18);
    border-radius: 30px;
    padding: 45px 35px;
    text-align: center;
    box-shadow: 0 20px 60px rgba(110,70,100,0.15);
    animation: aparecer 0.8s ease;
}

@keyframes aparecer {
    from {
        opacity: 0;
        transform: translateY(20px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

h1 {
    font-size: clamp(34px, 7vw, 62px);
    margin: 10px 0 20px;
    color: #8c4d73;
}

h2 {
    color: #9a547c;
    font-size: 30px;
}

p {
    font-size: 18px;
    line-height: 1.8;
}

.subtitle {
    font-size: 20px;
    font-style: italic;
    color: #89657b;
}

.heart {
    font-size: 60px;
    animation: latido 1.5s infinite;
}

@keyframes latido {
    0%, 100% {
        transform: scale(1);
    }
    50% {
        transform: scale(1.12);
    }
}

button {
    border: none;
    border-radius: 30px;
    padding: 14px 25px;
    margin: 8px;
    font-size: 16px;
    cursor: pointer;
    background: #b96d99;
    color: white;
    box-shadow: 0 8px 20px rgba(120,70,100,0.2);
    transition: 0.25s;
}

button:hover {
    transform: translateY(-3px);
    box-shadow: 0 12px 25px rgba(120,70,100,0.28);
}

.secondary {
    background: #ead6e5;
    color: #704b62;
}

.letters {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 16px;
    margin-top: 30px;
}

.letter-button {
    min-height: 100px;
    background: linear-gradient(135deg, #fff7fb, #f5e8f2);
    color: #754c66;
    border: 1px solid #ead0df;
}

.letter-button span {
    display: block;
    font-size: 28px;
    margin-bottom: 8px;
}

.letter-content {
    text-align: left;
    max-height: 62vh;
    overflow-y: auto;
    padding: 10px;
}

.letter-content p {
    white-space: pre-line;
}

.placeholder {
    margin: 25px auto;
    padding: 35px;
    border: 2px dashed #d8adc6;
    border-radius: 22px;
    background: #fff8fc;
    color: #987087;
}

.small {
    font-size: 14px;
    opacity: 0.75;
}

.hidden {
    display: none;
}

.fade {
    animation: aparecer 0.7s ease;
}

footer {
    margin-top: 25px;
    font-size: 13px;
    color: #9b788d;
}
</style>
</head>

<body>

<!-- PORTADA -->
<section id="inicio" class="screen active">

<!-- MENU DE CARTAS -->

            </button>

            <button class="letter-button" onclick="abrirCarta(8)">

            </button>

            <button class="letter-button" onclick="abrirCarta(9)">
                <span>🌙</span>

            </button>

            <button class="letter-button" onclick="abrirCarta(10)">
                <span>🌷</span>

            </button>

            <button class="letter-button" onclick="abrirCarta(12)">
                <span>📸</span>
                Nuestros recuerdos
            </button>

        </div>

        <br>

        <button class="secondary" onclick="mostrar('inicio')">
            ← Volver
        </button>
    </div>
</section>


<!-- CARTAS -->
<section id="carta" class="screen">
    <div class="card">

        <div id="contenidoCarta" class="letter-content"></div>

1: `
<h2>📖 Había una vez...</h2>

<p>
Una historia que no empezó con magia, sino con la suerte de encontrarnos, que literalmente me da pena contarle a nuestros hijos que fue por un juego, pero gracias a ese día que ambos entramos a jugar, Dios me dio la dicha de conocerte y caminar a tu lado.
</p>

<p>
Todo empezó un día en el cual estaba aburrida y tenía los pensamientos algo revueltos, no tenía nada que hacer y quería distraerme, en ese entonces estaba de vacaciones, así que decidí entrar a jugar Roblox.
</p>

<p>
Era un nuevo juego que apenas estaba saliendo, 99 noches. Lo había jugado una vez sola y quería intentar pasarlo. Cuando entré al juego estaba esperando que un grupito hiciera su equipo para colarme y entrar con ellos, ya que yo iba sola. Cuando veo un grupo que estaba creando sala, me metí y ahí estabas tú.
</p>

<p>
Lo primero que pensé es que eras de esos que se creían mucho por saber jugar y que solo iba a fastidiar. Jugamos como 30 min y se terminaron saliendo todos menos tú, y es cuando decidí mandarte solicitud. Lo raro fue que la aceptaras porque no habíamos hablado en todo ese rato que jugamos.
</p>

<p>
Después te mandé mensaje diciendo que me iría a dormir porque en serio sí moría de sueño. A la mañana siguiente te mandé mensaje en la tarde, si mi memoria no falla, y te pregunté si no querías jugar.
</p>

<p>
En ese entonces aclaro que aún no me gustabas, solo quería pasar 99 noches y tú eras pro. Ahora cuando jugamos te mueres cada que puedes JAJAJA.
</p>

<p>
Después que te mandé ese mensaje me respondiste un rato después porque según el señorito andaba jugando otra cosa. Te dije después de un rato que jugamos más tarde, respondiste que sí y ya no nos volvimos a hablar hasta en la noche.
</p>

<p>
Me uní al juego y también tú, y es cuando conocimos a René. Ese día nos pasamos el Instagram por el juego. Ni siquiera hablábamos por ahí, pero tu perfil se me hizo intrigante porque no tenías nada, eras súper misterioso y eso me llamó la atención.
</p>

<p>
Digamos que lo vi como un: ¿quién es este y por qué me llama la atención?
</p>

<p>
Después de eso creamos el grupo de los Oyayitos, donde hablamos los 3 y jugábamos Steal a Brainrot. Justo en ese juego empezamos a coquetear.
</p>

<p>
No te mandé mensaje nunca en privado hasta que me pediste ayuda de algo de Instagram. Hablamos más por el chat privado de Roblox.
</p>

<p>
Para no hacerle largo el cuento, porque todo esto ya lo sabes, empezamos a quedar un 9 de agosto, donde hablamos sobre nuestros miedos, qué era lo que ambos buscamos en esto, y quedamos en conocernos más.
</p>

<p>
Y empezaron los apodos de nobina pizzanina, trulimera chachachá, abina bananina, y recuerdo que cada que me decías así me enojaba. Después ya me empezó a gustar.
</p>

<p>
Después de esos empezó el nena, como hasta ahora me dices, y yo a ti noney, por el hecho de que me dio celos cuando andábamos jugando y le dijiste a otra de una manera linda. Y sí, me puse celosa. Puedo decirte que ahí mismo supe que me gustabas.
</p>

<p>
Después, un 19 de agosto, justo como hoy, en la tardecita nos hicimos novios, que debió haber sido 18 en la noche, pero me enojé y me fui a dormir jajaja.
</p>

<div class="placeholder">
    📸 Aquí irá una foto especial de nuestros comienzos.
</div>

<p>
Amo lo que somos, Uri.
</p>

<p>
Hace un año, nuestros caminos se cruzaron y mi mundo entero se llenó de luz. Desde ese instante supe que lo que nacía entre nosotros era algo único: una profunda limerencia, una fascinación tan bonita y constante que hace que mi corazón lata con más fuerza con solo pensar en ti.
</p>

<p>
Contigo he aprendido a amar verdaderamente desde el alma, poniendo todo mi meraki en cada abrazo y en esta historia que construimos juntos día a día.
</p>

<p>
Te has convertido en mi ikigai, la razón más dulce que ilumina mis mañanas y le da un sentido hermoso a mi vida, y también en mi querencia, ese refugio cálido e insustituible donde mi espíritu descansa y al que siempre quiero regresar, porque es en tus brazos donde realmente me siento en casa.
</p>

<p>
Agradezco infinitamente la belleza de nuestro vínculo, guiado por un amor con esencia de hesed que es leal, paciente, incondicional y siempre dispuesto a cuidar del otro sin importar nada.
</p>

<p>
Este primer aniversario es solo la primera página de un sentimiento sempiterno, un amor que nació hace 365 días, pero que está destinado a durar para toda la vida.
</p>

<h2>Feliz primer año, mi amor 🤍</h2>

<p>
Gracias por hacer que amar sea tan bonito.
</p>

<p>
Con cariño,<br>
tu inefable amor ❤️
</p>
`,

function mostrar(id) {

    document.querySelectorAll('.screen').forEach(function(seccion) {
        seccion.classList.remove('active');
    });

    document.getElementById(id).classList.add('active');

    window.scrollTo({
        top: 0,
        behavior: 'smooth'
    });
}


function abrirCarta(numero) {

    document.getElementById('contenidoCarta').innerHTML = cartas[numero];

    mostrar('carta');
}
