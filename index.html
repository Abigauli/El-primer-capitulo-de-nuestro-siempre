<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>El primer capítulo de nuestro siempre ❤️</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    font-family: Georgia, "Times New Roman", serif;
    background: linear-gradient(135deg, #fff0f6, #f5e9ff);
    color: #5b3b50;
    overflow-x: hidden;
}

body::before {
    content: "♡  ✦  ♡  ✧  ♡  ✦  ♡";
    position: fixed;
    top: 20px;
    left: 0;
    width: 100%;
    text-align: center;
    font-size: 22px;
    color: rgba(170, 105, 145, 0.25);
    letter-spacing: 18px;
    pointer-events: none;
}

.screen {
    min-height: 100vh;
    display: none;
    justify-content: center;
    align-items: center;
    padding: 30px 18px;
}

.screen.active {
    display: flex;
}

.card {
    width: min(850px, 95%);
    background: rgba(255,255,255,0.88);
    border: 1px solid rgba(160,100,140,0.18);
    border-radius: 30px;
    padding: 45px 35px;
    text-align: center;
    box-shadow: 0 20px 60px rgba(110,70,100,0.15);
    animation: aparecer 0.8s ease;
}

@keyframes aparecer {
    from {
        opacity: 0;
        transform: translateY(20px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

h1 {
    font-size: clamp(34px, 7vw, 62px);
    margin: 10px 0 20px;
    color: #8c4d73;
}

h2 {
    color: #9a547c;
    font-size: 30px;
}

p {
    font-size: 18px;
    line-height: 1.8;
}

.subtitle {
    font-size: 20px;
    font-style: italic;
    color: #89657b;
}

.heart {
    font-size: 60px;
    animation: latido 1.5s infinite;
}

@keyframes latido {
    0%, 100% {
        transform: scale(1);
    }
    50% {
        transform: scale(1.12);
    }
}

button {
    border: none;
    border-radius: 30px;
    padding: 14px 25px;
    margin: 8px;
    font-size: 16px;
    cursor: pointer;
    background: #b96d99;
    color: white;
    box-shadow: 0 8px 20px rgba(120,70,100,0.2);
    transition: 0.25s;
}

button:hover {
    transform: translateY(-3px);
    box-shadow: 0 12px 25px rgba(120,70,100,0.28);
}

.secondary {
    background: #ead6e5;
    color: #704b62;
}

.letters {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 16px;
    margin-top: 30px;
}

.letter-button {
    min-height: 100px;
    background: linear-gradient(135deg, #fff7fb, #f5e8f2);
    color: #754c66;
    border: 1px solid #ead0df;
}

.letter-button span {
    display: block;
    font-size: 28px;
    margin-bottom: 8px;
}

.letter-content {
    text-align: left;
    max-height: 62vh;
    overflow-y: auto;
    padding: 10px;
}

.letter-content p {
    white-space: pre-line;
}

.placeholder {
    margin: 25px auto;
    padding: 35px;
    border: 2px dashed #d8adc6;
    border-radius: 22px;
    background: #fff8fc;
    color: #987087;
}

.small {
    font-size: 14px;
    opacity: 0.75;
}

.hidden {
    display: none;
}

.fade {
    animation: aparecer 0.7s ease;
}

footer {
    margin-top: 25px;
    font-size: 13px;
    color: #9b788d;
}
</style>
</head>

<body>

<!-- PORTADA -->
<section id="inicio" class="screen active">
    <div class="card">
        <div class="heart">♡</div>

        <h1>El primer capítulo<br>de nuestro siempre</h1>

        <p class="subtitle">
            Una historia que comenzó de la manera más inesperada...
        </p>

        <p>
            Para Uriel,<br>
            con todo mi amor. 🤍
        </p>

        <button onclick="mostrar('cartas')">
            Abrir nuestros recuerdos ♡
        </button>

        <footer>
            19.08.2025 — ∞
        </footer>
    </div>
</section>


<!-- MENU DE CARTAS -->
<section id="cartas" class="screen">
    <div class="card">

        <h2>💌 Nuestros recuerdos</h2>

        <p>
            Doce cartas para doce meses,
            doce pedacitos de nuestra historia. 🤍
        </p>

        <div class="letters">

            <button class="letter-button" onclick="abrirCarta(1)">
                <span>📖</span>
                Había una vez...
            </button>

            <button class="letter-button" onclick="abrirCarta(2)">
                <span>🌙</span>
                Cuando me extrañes
            </button>

            <button class="letter-button" onclick="abrirCarta(3)">
                <span>👀</span>
                Cuando quieras saber qué veo cuando te miro
            </button>

            <button class="letter-button" onclick="abrirCarta(4)">
                <span>❤️</span>
                Por qué te amo
            </button>

            <button class="letter-button" onclick="abrirCarta(5)">
                <span>🤍</span>
                Cuando hayamos tenido una pelea
            </button>

            <button class="letter-button" onclick="abrirCarta(6)">
                <span>🌌</span>
                Cuando pienses en nuestro futuro
            </button>

            <button class="letter-button" onclick="abrirCarta(7)">
                <span>🤍</span>
                Cuando dudes de nosotros
            </button>

            <button class="letter-button" onclick="abrirCarta(8)">
                <span>🎶</span>
                Cuando escuches nuestras canciones
            </button>

            <button class="letter-button" onclick="abrirCarta(9)">
                <span>🌙</span>
                Cuando no puedas dormir
            </button>

            <button class="letter-button" onclick="abrirCarta(10)">
                <span>🌷</span>
                Para ti y las personas que amas
            </button>

            <button class="letter-button" onclick="abrirCarta(11)">
                <span>🏰</span>
                La batalla por nuestro siempre
            </button>

            <button class="letter-button" onclick="abrirCarta(12)">
                <span>📸</span>
                Nuestros recuerdos
            </button>

        </div>

        <br>

        <button class="secondary" onclick="mostrar('inicio')">
            ← Volver
        </button>
    </div>
</section>


<!-- CARTAS -->
<section id="carta" class="screen">
    <div class="card">

        <div id="contenidoCarta" class="letter-content"></div>

        <button class="secondary" onclick="mostrar('cartas')">
            ← Volver a las cartas
        </button>

    </div>
</section>

};


function mostrar(id) {

    document.querySelectorAll('.screen').forEach(function(seccion) {
        seccion.classList.remove('active');
    });

    document.getElementById(id).classList.add('active');

    window.scrollTo({
        top: 0,
        behavior: 'smooth'
    });
}


function abrirCarta(numero) {

    document.getElementById('contenidoCarta').innerHTML = cartas[numero];

    mostrar('carta');
}

</script>

</body>
</html>
